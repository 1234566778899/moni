# Keeps the Supabase Free project active (it pauses after 7 days without activity).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 * * *"   # daily, 08:17 America/Lima
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: https://dcsddqegjlfefdqmrqsb.supabase.co
          # Publishable key: public by design (it ships in the iOS app); data is protected by RLS.
          SUPABASE_KEY: sb_publishable_oTx_PYZ22_xpsaFwWfpZJg_VoeJduZd
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" -H "apikey: $SUPABASE_KEY")
          echo "Supabase REST status: $status"
          test "$status" = "200"
